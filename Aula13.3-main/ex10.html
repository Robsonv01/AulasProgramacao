<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="number" id="n1" placeholder="Coloque o n1: " />
    <input type="number" id="n2" placeholder="Coloque o n2: " />
    <br />
    <br />
    <button onclick="somar()">Somar</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <div id="resultado"></div>
    <script>
      function pegarValor() {
        let v1 = Number(document.getElementById("n1").value);
        let v2 = Number(document.getElementById("n2").value);
        return { v1, v2 };
      }
      function somar() {
        let { v1, v2 } = pegarValor();
        document.getElementById("resultado").textContent = `Resultado: ${
          v1 + v2
        }`;
      }
      function subtrair() {
        let { v1, v2 } = pegarValor();
        document.getElementById("resultado").textContent = `Resultado: ${
          v1 - v2
        }`;
      }
      function multiplicar() {
        let { v1, v2 } = pegarValor();
        document.getElementById("resultado").textContent = `Resultado: ${
          v1 * v2
        }`;
      }
      function dividir() {
        let { v1, v2 } = pegarValor();
        document.getElementById("resultado").textContent = `Resultado: ${
          v1 / v2
        }`;
      }
    </script>
  </body>
</html>
