<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="number" id="idade" placeholder="Coloque sua idade: " />
    <button id="mostrar">clique aqui</button>
    <div id="txt"></div>
    <script>
      document.getElementById("mostrar").addEventListener("click", () => {
        let idade = Number(document.getElementById("idade").value);
        document.getElementById("txt").textContent = `Sua idade é: ${idade}`;
      });
    </script>
  </body>
</html>
